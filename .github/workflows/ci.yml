name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEMO_MODE: "true"
      PRICES_ONLINE: "false"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://orbit:orbit@localhost:5432/orbit' || 'sqlite:///./data/ci.db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          if [ "${{ matrix.database }}" = "postgres" ]; then pip install psycopg[binary]; fi
      - name: Ruff and mypy
        if: matrix.database == 'sqlite'
        run: |
          ruff check app tests
          ruff format --check app tests
          mypy app
      - name: Pytest
        run: pytest -q --cov=app --cov-fail-under=85
      - name: Export OpenAPI
        if: matrix.database == 'sqlite'
        run: python scripts/export_openapi.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and check
        working-directory: web
        run: |
          npm install
          npm run typecheck
          npm test
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crypto-orbit .
