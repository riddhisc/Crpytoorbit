services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:///./data/orbit.db
      PRICES_ONLINE: "false"
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - orbit-data:/app/data
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"

volumes:
  orbit-data:
